name: Documentation Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-docs.txt

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Validate required front matter fields
        run: python scripts/validate_front_matter.py

      - name: Validate cross-artifact traceability
        run: python scripts/validate_traceability.py

      - name: Validate internal links and navigation
        run: python scripts/validate_links.py

      - name: Detect prohibited secret-like files
        shell: bash
        run: |
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) | grep -q .; then
            echo "Prohibited secret-like file detected."
            exit 1
          fi
