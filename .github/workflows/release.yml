name: Documentation Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub release requires write; no other job needs it.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create release archive
        run: |
          # Build outside the working tree: writing the archive into the
          # directory being archived makes tar fail with
          # "file changed as we read it".
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=site \
            -czf "${RUNNER_TEMP}/EAODS-${GITHUB_REF_NAME}.tar.gz" .
          mv "${RUNNER_TEMP}/EAODS-${GITHUB_REF_NAME}.tar.gz" .

      - name: Install PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-recommended \
            texlive-fonts-recommended texlive-latex-extra lmodern
          xelatex --version | head -1

      - name: Build framework PDF library
        run: |
          set -euo pipefail
          mkdir -p pdf
          expected=$(ls docs/frameworks/EAODS-v17.3/*.md | wc -l)
          for f in docs/frameworks/EAODS-v17.3/*.md; do
            base=$(basename "$f" .md)
            # No error masking: a conversion failure must fail the release.
            pandoc "$f" -o "pdf/${base}.pdf" \
              --from=gfm --pdf-engine=xelatex -V geometry:margin=2.5cm \
              -V colorlinks=true --toc
          done
          built=$(ls pdf/*.pdf | wc -l)
          echo "PDFs built: ${built} of ${expected} expected"
          if [ "${built}" -ne "${expected}" ]; then
            echo "::error::PDF library incomplete (${built}/${expected})"
            exit 1
          fi
          tar -czf "${RUNNER_TEMP}/EAODS-${GITHUB_REF_NAME}-pdf-library.tar.gz" pdf
          mv "${RUNNER_TEMP}/EAODS-${GITHUB_REF_NAME}-pdf-library.tar.gz" .
          ls -la pdf

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: "EAODS-${{ github.ref_name }}-sbom.spdx.json"
          output-file: "EAODS-${{ github.ref_name }}-sbom.spdx.json"

      - name: Extract curated release notes from CHANGELOG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            /^## \[/ {found=0}
            found {print}
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          # A missing section means the release increment skipped CHANGELOG.md.
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          files: |
            EAODS-${{ github.ref_name }}.tar.gz
            EAODS-${{ github.ref_name }}-sbom.spdx.json
            EAODS-${{ github.ref_name }}-pdf-library.tar.gz
